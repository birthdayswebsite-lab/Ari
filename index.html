<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday Roshni 🎂</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at bottom, #001f3f, #000);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    color: white;
    text-align: center;
  }

  h1 {
    font-size: 3rem;
    text-shadow: 0 0 30px #ff69b4, 0 0 60px #ff1493;
    animation: glow 2s ease-in-out infinite alternate;
    z-index: 10;
  }

  @keyframes glow {
    from { text-shadow: 0 0 20px #ff69b4; }
    to { text-shadow: 0 0 40px #ff0; }
  }

  p {
    font-size: 1.3rem;
    max-width: 700px;
    margin: 20px;
    text-shadow: 0 0 10px #fff;
    z-index: 10;
  }

  button {
    background: linear-gradient(90deg, #ff0066, #ff6600, #ffff33);
    border: none;
    padding: 1rem 2.5rem;
    border-radius: 50px;
    font-size: 1.4rem;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s;
    position: absolute;
    bottom: 40px;
    z-index: 10;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0.7); }
    70% { box-shadow: 0 0 25px 25px rgba(255, 105, 180, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0); }
  }

  button:hover {
    transform: scale(1.1);
  }

  /* Balloons */
  .balloon {
    position: absolute;
    width: 60px;
    height: 80px;
    border-radius: 50%;
    opacity: 0.9;
    animation: floatUp 8s linear forwards;
  }

  .string {
    position: absolute;
    width: 4px;
    height: 80px;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    clip-path: path("M 2 0 C 6 10, -2 20, 2 30 S 6 50, 2 60 S -4 70, 2 80");
    background: linear-gradient(to bottom, rgba(255,255,255,0.7), transparent);
    animation: wave 2s infinite ease-in-out;
  }

  @keyframes wave {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    50% { transform: translateX(-48%) rotate(2deg); }
  }

  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-120vh); opacity: 0; }
  }

  /* Fireworks canvas */
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

  <h1>🎉 Happy Birthday, Roshni 🎉</h1>
  <p>“Make It Count, Live The Moment” 💕</p>
  <p>"Click anywhere to fly?"</p>

  <button id="celebrateBtn">✨ Celebrate ✨</button>

  <audio id="bgMusic" loop>
    <source src="media/bgm.mp3" type="audio/mpeg">
  </audio>

  <canvas id="fireworks"></canvas>

  <script>
    const balloonColors = ['#0033cc', '#ff0000', '#ffff00', '#660066', '#ff4500'];

    function createBalloon(x = Math.random() * innerWidth, y = innerHeight + 100) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = (x - 30) + 'px';
      b.style.top = (y - 60) + 'px';
      b.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
      b.style.animationDuration = (6 + Math.random() * 4) + 's';
      const s = document.createElement('div');
      s.className = 'string';
      b.appendChild(s);
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 9000);
    }

    // Continuous balloon flow
    setInterval(() => { for (let i = 0; i < 2; i++) createBalloon(); }, 1000);

    // Balloons appear on touch or click
    document.addEventListener('click', e => {
      createBalloon(e.clientX, e.clientY);
    });
    document.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      createBalloon(touch.clientX, touch.clientY);
    });

    // Fireworks setup
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    let particles = [];

    function createFirework(x, y) {
      for (let i = 0; i < 80; i++) {
        particles.push({
          x, y,
          angle: Math.random() * 2 * Math.PI,
          speed: Math.random() * 5 + 2,
          alpha: 1,
          color: `hsl(${Math.random()*360},100%,60%)`
        });
      }
    }

    function animateFireworks() {
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.alpha -= 0.01;
        if (p.alpha <= 0) particles.splice(i, 1);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI);
        ctx.fill();
      });
      requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    // Initial fireworks when page loads
    window.onload = () => {
      for (let i = 0; i < 4; i++) {
        setTimeout(() => createFirework(innerWidth/2, innerHeight/2), i * 400);
      }
    };

    // Button click → play music, vibration, fireworks, redirect
    document.getElementById('celebrateBtn').addEventListener('click', () => {
      const music = document.getElementById('bgMusic');
      music.muted = false;
      music.play().catch(()=>{});

      // Strong vibration pattern
      if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 800]);

      // Burst fireworks
      for (let i = 0; i < 5; i++) {
        setTimeout(() => createFirework(innerWidth/2, innerHeight/2), i * 250);
      }

      const id = prompt("Enter your ID:");
      const pass = prompt("Enter your Password:");
      if (id === "roshni" && pass === "roshni") {
        alert("🎂 Welcome Roshni! Let’s begin the celebration!");
        window.location.href = "select.html";
      } else {
        alert("❌ Incorrect ID or Password!");
      }
    });
  </script>
</body>
</html>
